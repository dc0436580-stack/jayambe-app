<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JAY AMBE KIRANA STORE</title>
<style>
:root{--black:#000;--gold:#FFC400;--gold-soft:#e0a800;--white:#fff;--radius:999px;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:#000;color:var(--white);font-family:"Poppins","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#app{position:relative;width:100%;max-width:420px;height:100%;max-height:860px;background:#000}
#app.animating{overflow:hidden;pointer-events:none}
.page{position:absolute;inset:0;padding:10px;background:#000;will-change:transform}
.page.page-home{padding:0;background:#161616}
.page.splash{display:flex;align-items:center;justify-content:center}
.splash img{width:120px;height:auto;mix-blend-mode:lighten}
.screen{position:relative;height:100%;border:2.5px solid var(--gold);border-radius:34px;background:var(--black);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 24px;box-shadow:0 0 22px rgba(255,196,0,.18)}
.wave{position:absolute;width:100%;pointer-events:none}
.wave.top{top:0;left:0}.wave.bottom{bottom:0;left:0}
.content{position:relative;z-index:1;width:100%;display:flex;flex-direction:column;align-items:center;gap:clamp(18px,4vh,34px)}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{width:clamp(110px,34vw,150px);height:auto;mix-blend-mode:lighten;margin-bottom:6px}
.welcome{font-size:clamp(20px,5.6vw,24px);font-weight:600;margin:6px 0 2px}
.name{font-size:clamp(34px,10.5vw,44px);font-weight:800;color:var(--gold);letter-spacing:1px;line-height:1.05;margin:0}
.sub{font-size:clamp(22px,6.6vw,28px);font-weight:700;margin:2px 0 10px;letter-spacing:.5px}
.tagline{font-size:clamp(10px,3vw,12px);font-weight:500;margin:0}
.actions{width:100%;display:flex;flex-direction:column;gap:18px}
.btn{width:100%;height:56px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;gap:14px;font:inherit;font-size:17px;font-weight:600;cursor:pointer;border:2px solid transparent;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.97)}
.btn svg{width:24px;height:24px;flex:none}
.btn-login{background:var(--gold);color:#000}
.btn-signup{background:#000;color:#fff;border-color:rgba(255,196,0,.55)}
.btn-google{background:#fff;color:#000;font-size:16px}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}

/* ---- Login Page ---- */
.screen.login{justify-content:flex-start;padding:64px 24px 90px}
.back-btn{position:absolute;top:18px;left:18px;z-index:2;width:44px;height:44px;border:0;background:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%}
.back-btn svg{width:28px;height:28px}
.login .content{gap:0;flex:1;justify-content:center}
.login .logo{width:clamp(96px,28vw,124px);margin-bottom:2px}
.login .name{font-size:clamp(26px,8vw,32px)}
.login .sub{font-size:clamp(19px,5.6vw,23px);margin:0 0 14px}
.page-title{font-size:clamp(30px,9vw,38px);font-weight:800;color:var(--gold);margin:0 0 4px}
.page-sub{font-size:14px;font-weight:500;margin:0 0 20px;text-align:center}
.login-form{width:100%;display:flex;flex-direction:column;gap:14px}
.field{display:flex;align-items:center;gap:14px;height:56px;padding:0 16px;border-radius:18px;background:#141414;border:1.5px solid #3a3a3a;color:#fff}
.field:focus-within{border-color:var(--gold)}
.field.invalid{border-color:#ff6b6b}
.field>svg{width:24px;height:24px;flex:none}
.field input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:16px}
.field input::placeholder{color:#bdbdbd}
.eye-btn{background:none;border:0;color:#fff;padding:6px;margin-right:-6px;cursor:pointer;display:flex}
.eye-btn svg{width:24px;height:24px}
.form-msg{min-height:20px;margin:0;font-size:13px;font-weight:500;text-align:center;color:#ff7b7b}
.form-msg.ok{color:var(--gold)}
.btn-submit{background:var(--gold);color:#000;margin-top:2px}
.btn[disabled]{opacity:.75;cursor:not-allowed}
.spinner{width:20px;height:20px;border:3px solid rgba(0,0,0,.25);border-top-color:#000;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.link-back{margin-top:16px;background:none;border:0;color:#fff;font:inherit;font-size:15px;font-weight:500;display:flex;align-items:center;gap:10px;cursor:pointer;padding:8px 12px}
.link-back svg{width:22px;height:22px}
.login .wave.bottom{height:56px}

/* ---- Home Screen ---- */
.home{height:100%;display:flex;flex-direction:column;background:#161616;color:#fff}
.home-header{position:relative;flex:none;background:#0d0d0d;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 22px;display:flex;align-items:flex-start;gap:12px}
.home-logo{width:84px;height:auto;flex:none;mix-blend-mode:lighten;margin-top:6px}
.home-brand{flex:1;min-width:0}
.home-brand p,.home-brand h1{margin:0}
.hb-welcome{font-size:clamp(13px,4vw,16px);font-weight:500;line-height:1.1}
.hb-name{font-size:clamp(28px,9vw,36px);font-weight:800;color:var(--gold);line-height:1.05;letter-spacing:.5px}
.hb-sub{font-size:clamp(17px,5.4vw,21px);font-weight:700;line-height:1.15}
.hb-tag{font-size:clamp(10px,3vw,12px);font-weight:500;color:var(--gold);margin-top:4px!important;line-height:1.25}
.icon-btn{flex:none;width:44px;height:44px;border:0;background:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%;margin:-2px -6px 0 0}
.icon-btn svg{width:28px;height:28px}
.header-curve{position:absolute;left:0;bottom:-1px;width:100%;height:14px;display:block}
.home-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:18px 10px 18px}
.search{display:flex;align-items:center;gap:12px;height:54px;padding:0 18px;margin:0 2px 22px;border-radius:20px;background:#262626;border:1.5px solid #343434;color:#aaa}
.search:focus-within{border-color:var(--gold)}
.search svg{width:24px;height:24px;flex:none;color:#cfcfcf}
.search input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:16px}
.search input::placeholder{color:#8e8e8e}
.section-title{font-size:clamp(16px,5vw,22px);font-weight:600;margin:0 2px 14px}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat-card{aspect-ratio:2/3;border:0;border-radius:16px;padding:8px 5px 9px;display:flex;flex-direction:column;align-items:center;color:#111;font:inherit;cursor:pointer;text-align:center;transition:transform .12s}
.cat-card:active{transform:scale(.96)}
.cat-emoji{flex:1;display:flex;align-items:center;justify-content:center;font-size:clamp(30px,10vw,42px);line-height:1;font-family:"Apple Color Emoji","Noto Color Emoji","Segoe UI Emoji",sans-serif}
.cat-row{display:flex;align-items:flex-end;justify-content:center;gap:2px;width:100%;min-height:3.4em}
.cat-name{font-size:clamp(10px,3vw,12.5px);font-weight:600;line-height:1.2;flex:1;min-width:0;display:flex;align-items:flex-end;justify-content:center}
.cat-row svg{width:14px;height:14px;flex:none;margin-bottom:2px}
.bottom-nav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:#0d0d0d;border-top:1px solid #222;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px))}
.nav-item{position:relative;background:none;border:0;color:#d8d8d8;font:inherit;font-size:clamp(11px,3.2vw,13px);display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0 8px;cursor:pointer}
.nav-item svg{width:28px;height:28px}
.nav-item.active{color:var(--gold);font-weight:600}
.nav-item.active::after{content:"";position:absolute;bottom:0;width:38px;height:3px;border-radius:3px;background:var(--gold)}
.nav-icon{position:relative;display:flex}
.cart-badge{position:absolute;top:-8px;right:-12px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--gold);color:#000;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}

/* ---- Username Page ---- */
.page-title.plain{color:#fff;font-size:clamp(24px,7.4vw,30px);font-weight:700}

/* ---- Categories Page ---- */
.page[data-screen="categories"]{background:#0b0b0b}
.cats{height:100%;display:flex;flex-direction:column;background:#0b0b0b;color:#fff}
.cats-header{position:relative;flex:none;margin:calc(10px + env(safe-area-inset-top,0px)) 10px 0;padding:20px 30px 26px;border:2.5px solid var(--gold);border-bottom:0;border-radius:26px 26px 0 0;text-align:center;background:#000}
.cats-header .back-btn{top:8px;left:6px}
.cats-title{margin:0;font-size:clamp(30px,9.5vw,38px);font-weight:800;color:var(--gold);line-height:1.1}
.cats-sub{margin:4px 0 0;font-size:clamp(11.5px,3.4vw,14px);font-weight:500;white-space:nowrap}
.cats-curve{position:absolute;left:-2.5px;right:-2.5px;bottom:-13px;width:calc(100% + 5px);height:16px;display:block}
.cats .home-scroll{padding-top:30px;background:#0b0b0b}
.cats .search{margin-bottom:18px}
.cats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cats-grid .cat-card{aspect-ratio:.92;padding:10px 6px 10px;border-radius:20px}
.cats-grid .cat-emoji{font-size:clamp(38px,12.5vw,52px)}
.cats-grid .cat-name{font-size:clamp(11.5px,3.4vw,14px)}
.cats-grid .cat-row{min-height:2.7em}
.cats-grid .cat-row svg{width:15px;height:15px}
.cat-card[hidden]{display:none}
.cats-empty{margin:28px 8px;text-align:center;color:#bdbdbd;font-size:14px}

/* ---- Cart Page ---- */
.page[data-screen="cart"]{background:#0b0b0b}
.cart{height:100%;display:flex;flex-direction:column;background:#0b0b0b;color:#fff}
.cart .home-header{background:#000}
.cart-title{flex:none;display:flex;align-items:center;gap:16px;padding:20px 20px 6px}
.cart-title svg{width:40px;height:40px;color:var(--gold);flex:none}
.cart-title::after{content:none}
.cart-title .bar{width:2.5px;height:44px;background:var(--gold);border-radius:2px}
.cart-title h1{margin:0;font-size:clamp(26px,8vw,32px);font-weight:700}
.cart-body{position:relative;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:10px 16px 20px}
.cart-empty{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:70px}
.cart-art{width:min(70vw,260px);height:auto;margin-bottom:14px}
.cart-empty h2{margin:0 0 6px;font-size:clamp(22px,6.6vw,27px);font-weight:600}
.cart-empty p{margin:0 0 26px;font-size:clamp(14px,4vw,16px);color:#e6e6e6}
.cart-empty .btn,.cart-actions .btn{position:relative;z-index:1}
.cart-empty .btn{max-width:420px}
.btn-gold{background:var(--gold);color:#000}
.btn-outline{background:transparent;color:var(--gold);border-color:var(--gold)}
.btn svg{width:26px;height:26px}
.cart-empty .wave.bottom,.cart-body>.wave.bottom{height:70px}
.ci{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:12px;border-radius:18px;background:#1a1a1a;border:1px solid #2c2c2c}
.ci-img{flex:none;width:68px;height:68px;border-radius:14px;background:#fff1c9;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:34px;font-family:"Apple Color Emoji","Noto Color Emoji","Segoe UI Emoji",sans-serif}
.ci-img img{width:100%;height:100%;object-fit:cover}
.ci-info{flex:1;min-width:0}
.ci-name{margin:0 0 2px;font-size:15px;font-weight:600;overflow-wrap:anywhere}
.ci-price{margin:0 0 8px;font-size:14px;color:var(--gold);font-weight:600}
.ci-qty{display:inline-flex;align-items:center;border:1.5px solid #3a3a3a;border-radius:999px;overflow:hidden}
.ci-qty button{width:36px;height:34px;border:0;background:none;color:#fff;font:inherit;font-size:20px;line-height:1;cursor:pointer}
.ci-qty button:active{background:#2a2a2a}
.ci-qty span{min-width:30px;text-align:center;font-weight:700}
.ci-remove{flex:none;width:40px;height:40px;border:0;border-radius:50%;background:none;color:#ff7b7b;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ci-remove svg{width:22px;height:22px}
.ci-confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.ci-confirm button{border:0;border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.ci-confirm .yes{background:#ff7b7b;color:#000}
.ci-confirm .no{background:#2e2e2e;color:#fff}
.summary{margin:18px 0 16px;padding:16px;border-radius:20px;background:#141414;border:1.5px solid rgba(255,196,0,.55)}
.summary h3{margin:0 0 10px;font-size:17px;font-weight:700;color:var(--gold)}
.sum-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:15px}
.sum-row.total{margin-top:6px;padding-top:12px;border-top:1px solid #333;font-size:18px;font-weight:700}
.sum-row.total span:last-child{color:var(--gold)}
.sum-row.save span:last-child{color:#7dde92}
.sum-note{margin:6px 0 0;font-size:13px;color:#bdbdbd}
.cart-actions{display:flex;flex-direction:column;gap:12px}

/* ---- Profile Page ---- */
.page[data-screen="profile"]{background:#0b0b0b}
.profile{position:relative;height:100%;display:flex;flex-direction:column;background:#0b0b0b;color:#fff}
.profile .home-header{background:#000}
.p-hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 0 18px}
.avatar{width:104px;height:104px;border-radius:50%;border:3px solid var(--gold);background:#121212;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 22px rgba(255,196,0,.28);margin-bottom:12px}
.avatar svg{width:58px;height:58px;color:#fff}
.avatar img{width:100%;height:100%;object-fit:cover}
.p-name{margin:0;font-size:clamp(24px,7.4vw,30px);font-weight:700;overflow-wrap:anywhere}
.p-name.muted{font-size:18px;font-weight:600;color:#bdbdbd}
.p-email{margin:4px 0 10px;font-size:15px;color:#d8d8d8;overflow-wrap:anywhere}
.p-pill{display:inline-block;padding:5px 14px;border-radius:999px;background:var(--gold);color:#000;font-size:13px;font-weight:700}
.p-card{margin-bottom:16px;padding:16px;border-radius:20px;background:#161616;border:1px solid #2c2c2c}
.p-card h3{margin:0 0 6px;font-size:17px;font-weight:700;color:var(--gold)}
.p-row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #262626;font-size:14px}
.p-row:last-of-type{border-bottom:0}
.p-row span:first-child{color:#bdbdbd;flex:none}
.p-row span:last-child{text-align:right;min-width:0;overflow-wrap:anywhere;font-weight:600;font-size:14px}
.p-demo{margin:8px 0 0;font-size:12.5px;color:#bdbdbd}
.p-menu{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.p-item{width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;background:#161616;border:1.5px solid #333;color:#fff;font:inherit;text-align:left;cursor:pointer}
.p-item:active{background:#202020}
.p-item .ico{flex:none;width:30px;height:30px;color:var(--gold)}
.p-item .ico svg{width:100%;height:100%}
.p-item .txt{flex:1;min-width:0}
.p-item .txt b{display:block;font-size:16px;font-weight:600}
.p-item .txt small{display:block;font-size:13px;color:#bdbdbd;margin-top:2px}
.p-item .chev{flex:none;width:20px;height:20px;color:#fff}
.btn-danger{background:rgba(255,92,92,.12);color:#ff7b7b;border-color:rgba(255,92,92,.6);margin:6px 0 12px}
.overlay{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.74);display:flex;align-items:center;justify-content:center;padding:24px}
.overlay[hidden]{display:none}
.dialog{width:100%;max-width:360px;background:#1a1a1a;border:1.5px solid rgba(255,196,0,.5);border-radius:22px;padding:22px}
.dialog h2{margin:0 0 8px;font-size:20px;font-weight:700}
.dialog p{margin:0 0 16px;font-size:15px;color:#e0e0e0;line-height:1.4}
.dialog .field{margin-bottom:8px}
.dialog .form-msg{text-align:left;margin-bottom:10px}
.d-actions{display:flex;gap:12px}
.d-actions .btn{height:48px;font-size:16px}
.btn-red{background:#ff5c5c;color:#000}
.btn-ghost{background:#2a2a2a;color:#fff}

.toast{position:absolute;left:18px;right:18px;bottom:28px;z-index:50;padding:12px 16px;border-radius:14px;background:#1a1a1a;color:#fff;border:1.5px solid rgba(255,196,0,.6);font-size:14px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.6)}
</style>
</head>

/* ---------- Reusable components ---------- */
let waveSeq = 0;
const Wave = (pos) => {
  const top = pos === "top";
  const gid = `g-${pos}-${++waveSeq}`;
  const d = top
    ? "M0 0H330V10C260 20 215 70 140 62C90 56 50 70 0 118Z"
    : "M0 100C70 50 130 62 200 76C260 88 300 60 330 14V110H0Z";
  const d2 = top
    ? "M0 0H250C190 6 150 40 100 38C60 36 30 52 0 84Z"
    : "M0 110C80 74 140 86 210 98C262 106 300 90 330 62V110Z";
  return `<svg class="wave ${pos}" viewBox="0 0 330 ${top ? 125 : 110}" preserveAspectRatio="none" height="${top ? 78 : 70}" aria-hidden="true">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a6a00"/><stop offset=".5" stop-color="#FFC400"/><stop offset="1" stop-color="#ffe27a"/></linearGradient></defs>
    <path d="${d}" fill="url(#${gid})" opacity=".95"/>
    <path d="${d2}" fill="#000"/>
  </svg>`;
};

const Button = ({ id, label, icon, className }) =>
  `<button type="button" class="btn ${className}" data-action="${id}">${icon}<span>${label}</span></button>`;

const AppState = { user: null, profile: {}, cartCount: 0 };

function getAuth() {
  if (!window.firebase || !FIREBASE_CONFIG.apiKey) return null;
  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  return firebase.auth();
}

function getDb() {

  return firebase.firestore();
}

const AUTH_ERRORS = {
  "auth/email-already-in-use": "Is email se account pehle se bana hua hai. Log In karein.",
  "auth/weak-password": "Password kam se kam 8 characters ka hona chahiye.",

async function onLoginSuccess(user) {

// Login/Sign-In ke baad: username saved ho to Home, warna Username Page.
async function routeAfterAuth(user, anim = "forward") {
  AppState.user = user;
  const snap = await getDb().collection("users").doc(user.uid).get();
  const data = snap.exists ? snap.data() : null;
  const username = data && data.username ? data.username : null;
  AppState.profile = { ...AppState.profile, email: user.email || null, username };
  if (anim === "none") show(username ? "home" : "username", { anim: "none" });
  else show(username ? "home" : "username", username ? { anim, reset: true } : { anim });
}

function mountLogin() {
  const $ = (id) => document.getElementById(id);
  const form = $("login-form"), email = $("email"), pass = $("password");
  const msg = $("form-msg"), btn = $("login-btn"), eye = $("toggle-pass");
  let busy = false;
  let done = false;

  const setMsg = (text, ok = false) => {
    msg.textContent = text;
    msg.classList.toggle("ok", ok);
  };
  const mark = (field, bad) => $(field).classList.toggle("invalid", bad);
  const setBusy = (on) => {
    busy = on;
    btn.disabled = on;
    btn.innerHTML = on ? '<span class="spinner" aria-hidden="true"></span><span>Ruko...</span>' : "<span>Login Karein</span>";
  };

  eye.addEventListener("click", () => {
    const show = pass.type === "password";
    pass.type = show ? "text" : "password";
    eye.innerHTML = show ? ICONS.eyeOff : ICONS.eye;
    eye.setAttribute("aria-label", show ? "Password chhupayein" : "Password dikhayein");
  });
  [email, pass].forEach((el) => el.addEventListener("input", () => { setMsg(""); mark("email-field", false); mark("password-field", false); }));

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (busy) return;
    const mail = email.value.trim();
    const pw = pass.value;
    mark("email-field", false); mark("password-field", false);

    if (!mail) { mark("email-field", true); return setMsg("Email enter karein."); }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(mail)) { mark("email-field", true); return setMsg("Valid email address enter karein."); }
    if (!pw) { mark("password-field", true); return setMsg("Password enter karein."); }

    const auth = getAuth();
    if (!auth) return setMsg("Firebase setup baaki hai, isliye login abhi nahi ho sakta.");
    if (!navigator.onLine) return setMsg("Internet connection check karein.");

    setBusy(true);
    setMsg("");
    try {
      const cred = await auth.signInWithEmailAndPassword(mail, pw);
      pass.value = "";
      await onLoginSuccess(cred.user);
      done = true;
    } catch (err) {
      setMsg(AUTH_ERRORS[err && err.code] || GENERIC_ERROR);
    } finally {
      if (!done) setBusy(false);
    }
  });
}

const MIN_PASSWORD_LENGTH = 8;
const EMAIL_PATTERN = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

// Form check: error text (Hinglish) lautata hai, sab theek ho to null.
function validateSignup(email, password) {
  if (!email) return { field: "email", text: "Email enter karein." };
  if (!EMAIL_PATTERN.test(email)) return { field: "email", text: "Valid email address enter karein." };
  if (!password) return { field: "password", text: "Password enter karein." };
  if (password.length < MIN_PASSWORD_LENGTH) return { field: "password", text: "Password kam se kam 8 characters ka hona chahiye." };
  return null;
}

// Firebase Auth se asli account. Password sirf Firebase ko jaata hai, kahin save ya log nahi hota.
async function submitSignup(email, password) {
  const auth = getAuth();
  if (!auth) return { ok: false, text: GENERIC_ERROR };
  if (!navigator.onLine) return { ok: false, text: "Internet connection check karein." };
  try {
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    AppState.user = cred.user;
    return { ok: true, user: cred.user };
  } catch (err) {
    return { ok: false, text: AUTH_ERRORS[err && err.code] || GENERIC_ERROR };
  }
}

function mountSignup(root) {
  const q = (r) => root.querySelector(`[data-role="${r}"]`);
  const form = q("signup-form"), email = q("email"), pass = q("password"), msg = q("msg"), eye = q("toggle-pass");
  let busy = false;

  const setMsg = (text) => { msg.textContent = text; };

    eye.innerHTML = show ? ICONS.eyeOff : ICONS.eye;
    eye.setAttribute("aria-label", show ? "Password chhupayein" : "Password dikhayein");
  });
  [email, pass].forEach((el) => el.addEventListener("input", () => { setMsg(""); clearMarks(); }));

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (busy) return;
    clearMarks();
    const err = validateSignup(email.value.trim(), pass.value);

const USERNAME_MIN = 3, USERNAME_MAX = 20;
const USERNAME_PATTERN = /^[A-Za-z0-9_]+$/;

const UsernameScreen = () => `

          <input data-role="username" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Username" aria-label="Username">
        </label>

        <button type="submit" class="btn btn-submit" data-role="submit"><span>Continue</span></button>

    </div>
    ${Wave("bottom")}
  </main>`;

// Username ko hamesha lowercase mein compare/store karein ("Avansh123" == "avansh123").
const normalizeUsername = (raw) => String(raw || "").trim().toLowerCase();

// Form check: { text } error lautata hai, sab theek ho to null. (Ye sirf format check hai, uniqueness nahi.)
function validateUsername(raw) {
  const name = String(raw || "").trim();
  if (!name) return { text: "Username enter karein." };
  if (/\s/.test(name)) return { text: "Username mein space allowed nahi hai." };
  if (!USERNAME_PATTERN.test(name)) return { text: "Username mein sirf letters, numbers aur underscore (_) allowed hain." };
  if (name.length < USERNAME_MIN) return { text: "Username kam se kam 3 characters ka hona chahiye." };
  if (name.length > USERNAME_MAX) return { text: "Username zyada se zyada 20 characters ka ho sakta hai." };
  return null;
}

const USERNAME_TAKEN_MESSAGE = "Ye username pehle se use ho raha hai. Koi doosra username try karein.";

/* Backend ke liye contract (Firebase integration ke waqt yahin implement hoga):
   - Uniqueness frontend par check karke guarantee nahi hoti. Backend par ATOMIC operation chahiye.
   - Firestore plan: collection "usernames", document ID = normalizeUsername(name), data { uid }.
     Ek transaction/batch mein: usernames/{key} create karo (agar pehle se hai to fail => USERNAME_TAKEN)
     aur users/{uid}.username set karo. Security rules: usernames/{key} sirf tab create ho jab pehle exist na kare
     aur request.auth.uid == data.uid. Do users ek saath try karein to bhi sirf ek create hota hai.
   - Return: { ok: true, username } | { ok: false, reason: "taken" | "unavailable" | "error", text } */
async function reserveUsername(username) {
  const auth = getAuth(), db = getDb();
  const user = auth && auth.currentUser;
  if (!db || !user) return { ok: false, reason: "error", text: "Session khatam ho gaya. Dobara login karein." };
  const key = normalizeUsername(username);
  const nameRef = db.collection("usernames").doc(key);
  const userRef = db.collection("users").doc(user.uid);
  try {
    await db.runTransaction(async (tx) => {
      const snap = await tx.get(nameRef);
      if (snap.exists && snap.data().uid !== user.uid) { const e = new Error("taken"); e.code = "username-taken"; throw e; }
      if (!snap.exists) tx.set(nameRef, { uid: user.uid });
      tx.set(userRef, { username, usernameLower: key, email: user.email || null, createdAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
    });
    return { ok: true, username };
  } catch (err) {
    return reservationError(err);
  }
}

function reservationError(err) {
  const code = err && err.code;
  if (code === "username-taken") return { ok: false, reason: "taken" };
  if (code === "unavailable" || code === "network-request-failed") return { ok: false, reason: "unavailable", text: "Internet connection check karein." };
  return { ok: false, reason: "error", text: GENERIC_ERROR };
}

// Reserve hone ke baad: profile mein username rakho aur existing Home Screen kholo.
function onUsernameReserved(username) {
  AppState.profile = { ...AppState.profile, username };
  show("home", { anim: "forward", reset: true });
}

function mountUsername(root) {
  const q = (r) => root.querySelector(`[data-role="${r}"]`);
  const form = q("username-form"), input = q("username"), msg = q("msg"), btn = q("submit"), field = q("username-field");
  let busy = false, done = false;

  const setBusy = (on) => {
    busy = on; btn.disabled = on;
    btn.innerHTML = on ? '<span class="spinner" aria-hidden="true"></span><span>Ruko...</span>' : "<span>Continue</span>";
  };
  input.addEventListener("input", () => { msg.textContent = ""; field.classList.remove("invalid"); });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (busy || done) return;
    field.classList.remove("invalid");
    const err = validateUsername(input.value);
    if (err) { field.classList.add("invalid"); msg.textContent = err.text; return; }

    setBusy(true);
    msg.textContent = "";
    try {
      const res = await reserveUsername(input.value.trim());
      if (res.ok) { done = true; onUsernameReserved(res.username); }
      else { field.classList.add("invalid"); msg.textContent = res.reason === "taken" ? USERNAME_TAKEN_MESSAGE : res.text; }
    } catch (_) {
      msg.textContent = "Kuch problem hui hai. Dobara try karein.";
    } finally {
      if (!done) setBusy(false);
    }
  });
}

/* ---------- Cart (shared state) ----------
   Home, Categories aur Cart Page ek hi `Cart` use karte hain.
   Abhi koi product database nahi hai, isliye products tab aayenge jab Product pages bante hain:
   Cart.add({ id, name, price, mrp?, image?, icon? }) call karne se item cart mein aa jaata hai.
   Same id dobara add karne par quantity badhti hai (duplicate item nahi banta).
   Firebase ke baad bas persist/sync layer yahin jodni hai. */
const STORE_CONFIG = {
  deliveryCharge: null          // Jab delivery charge tay ho jaaye tab number daalein; null = delivery row nahi dikhegi
};

const Cart = (() => {
  const items = new Map();
  const listeners = new Set();
  const emit = () => listeners.forEach((fn) => fn());
  const hasPrice = (i) => typeof i.price === "number" && i.price >= 0;
  return {
    add(product, qty = 1) {
      if (!product || !product.id || !(qty > 0)) return;
      const cur = items.get(product.id);
      if (cur) cur.qty += qty; else items.set(product.id, { ...product, qty });
      emit();
    },
    setQty(id, qty) {
      const cur = items.get(id);
      if (!cur) return;
      if (qty <= 0) items.delete(id); else cur.qty = qty;
      emit();
    },
    remove(id) { if (items.delete(id)) emit(); },
    clear() { items.clear(); emit(); },
    list() { return [...items.values()]; },
    count() { let n = 0; items.forEach((i) => { n += i.qty; }); return n; },
    subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); },
    summary() {
      const list = [...items.values()];
      const totalItems = list.reduce((n, i) => n + i.qty, 0);
      const allPriced = list.length > 0 && list.every(hasPrice);
      if (!allPriced) return { totalItems, priced: false };
      const net = list.reduce((s, i) => s + i.price * i.qty, 0);
      const gross = list.reduce((s, i) => s + (typeof i.mrp === "number" && i.mrp > i.price ? i.mrp : i.price) * i.qty, 0);
      const discount = gross - net;
      const delivery = typeof STORE_CONFIG.deliveryCharge === "number" ? STORE_CONFIG.deliveryCharge : null;
      return { totalItems, priced: true, subtotal: gross, discount, delivery, grandTotal: net + (delivery || 0) };
    }
  };
})();

function mountCart(root) {
  const body = root.querySelector('[data-role="cart-body"]');
  let pendingRemove = null;       // jis item par "hataayein?" poocha ja raha hai

  const render = () => {
    const list = Cart.list();
    if (!list.length) {
      body.innerHTML = `
        <div class="cart-empty">
          ${EmptyCartArt()}
          <h2>Aapka Cart Khali Hai!</h2>
          <p>Abhi tak koi product cart me nahi hai.</p>
          <button type="button" class="btn btn-gold" data-action="continue-shopping">${ICONS.bag}<span>Continue Shopping</span></button>
        </div>
        ${Wave("bottom")}`;
      return;
    }
    body.innerHTML = `
      ${list.map((i) => CartItemCard(i, i.id === pendingRemove)).join("")}
      ${SummaryCard(Cart.summary())}
      <div class="cart-actions">
        <button type="button" class="btn btn-gold" data-action="checkout">Proceed to Checkout</button>
        <button type="button" class="btn btn-outline" data-action="continue-shopping">${ICONS.bag}<span>Continue Shopping</span></button>
      </div>`;
  };

  body.addEventListener("click", (e) => {
    const b = e.target.closest("[data-cart]");
    if (!b) return;
    const id = b.closest(".ci")?.dataset.id;
    const item = Cart.list().find((i) => i.id === id);
    if (!item) return;
    switch (b.dataset.cart) {
      case "inc": pendingRemove = null; Cart.setQty(id, item.qty + 1); break;
      case "dec": if (item.qty <= 1) { pendingRemove = id; render(); } else Cart.setQty(id, item.qty - 1); break;   // quantity 0 hone se pehle remove ka option
      case "remove": pendingRemove = null; Cart.remove(id); break;
      case "confirm-yes": pendingRemove = null; Cart.remove(id); break;
      case "confirm-no": pendingRemove = null; render(); break;
    }
  });

  const unsubscribe = Cart.subscribe(() => {
    if (!root.isConnected) { unsubscribe(); return; }
    render();
  });
  render();
}

/* Backend contract (Firebase ke baad): username update.
   - Transaction/batch mein: naya usernames/{newKey} create karo (agar pehle se hai to fail => taken),
     users/{uid}.username update karo, aur SIRF uske baad purana usernames/{oldKey} delete karo.
   - Return: { ok: true, username } | { ok: false, reason: "taken" | "unavailable" | "error", text } */
async function updateUsername(newName, user) {
  const auth = getAuth(), db = getDb();
  const cu = user || (auth && auth.currentUser);
  if (!db || !cu) return { ok: false, reason: "error", text: "Session khatam ho gaya. Dobara login karein." };
  const newKey = normalizeUsername(newName);
  const userRef = db.collection("users").doc(cu.uid);
  const newRef = db.collection("usernames").doc(newKey);
  try {
    await db.runTransaction(async (tx) => {
      const [userSnap, newSnap] = await Promise.all([tx.get(userRef), tx.get(newRef)]);
      const oldKey = userSnap.exists ? userSnap.data().usernameLower : null;
      if (newSnap.exists && newSnap.data().uid !== cu.uid) { const e = new Error("taken"); e.code = "username-taken"; throw e; }
      if (!newSnap.exists) tx.set(newRef, { uid: cu.uid });                       // pehle naya reserve
      tx.set(userRef, { username: newName, usernameLower: newKey }, { merge: true });
      if (oldKey && oldKey !== newKey) tx.delete(db.collection("usernames").doc(oldKey));   // purana tabhi release jab naya reserve ho
    });
    return { ok: true, username: newName };
  } catch (err) {
    return reservationError(err);
  }
}

/* Asli Google Sign-In (Firebase ke baad, demo ki jagah):
   - Official Firebase/Google flow use hoga: signInWithPopup/Redirect(new firebase.auth.GoogleAuthProvider()).
     Account chooser Google ka apna hoga; hamare app mein Google password kabhi enter nahi hoga.
   - Naya user (username saved nahi) -> Username Page; purana user (username saved) -> seedha Home.
   - Fail hone par Hinglish error: "Google se login nahi ho paya. Dobara try karein." */
const GOOGLE_ERRORS = {
  "auth/popup-blocked": "Popup block ho gaya. Browser mein popup allow karke dobara try karein.",
  "auth/network-request-failed": "Internet connection check karein.",
  "unavailable": "Internet connection check karein.",
  "auth/unauthorized-domain": "Ye website Firebase mein authorize nahi hai."
};
let googleBusy = false;
async function startGoogleSignIn() {
  if (googleBusy) return;
  const auth = getAuth();
  if (!auth) { showToast(GENERIC_ERROR); return; }
  googleBusy = true;
  try {
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });
    const res = await auth.signInWithPopup(provider);     // account chooser Google ka apna hai
    await routeAfterAuth(res.user);
  } catch (err) {
    const code = err && err.code;
    if (code === "auth/popup-closed-by-user" || code === "auth/cancelled-popup-request") return;
    showToast(GOOGLE_ERRORS[code] || "Google se login nahi ho paya. Dobara try karein.");
  } finally {
    googleBusy = false;
  }
}

const screens = { splash: SplashScreen, welcome: WelcomeScreen, login: LoginScreen, home: HomeScreen, signup: SignupScreen, username: UsernameScreen, categories: CategoriesScreen, cart: CartScreen, profile: ProfileScreen };
const mounts = { login: mountLogin, signup: mountSignup, username: mountUsername, categories: mountCategories, cart: mountCart, profile: mountProfile };           // screen ke baad chalne wale setup functions
const TRANSITION = { duration: 300, easing: "cubic-bezier(.22,.8,.24,1)", behind: "-28%" };
const Nav = { name: null, el: null, stack: [], busy: false };
const appEl = document.getElementById("app");
const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

function makePage(name) {
  const el = document.createElement("div");
  el.className = "page" + (name === "home" || name === "categories" || name === "cart" || name === "profile" ? " page-home" : name === "splash" ? " splash" : "");
  el.dataset.screen = name;
  el.innerHTML = screens[name]();
  return el;
}

/* anim: "forward" (nayi screen right se aaye) | "back" (reverse) | "none"
   reset: true => navigation stack naye sire se shuru (jaise login ke baad Home) */
function show(name, { anim = "forward", reset = false } = {}) {
  if (Nav.busy || !screens[name]) return;
  const prev = Nav.el;
  const next = makePage(name);

  if (reset || anim === "none") Nav.stack = [name];
  else if (anim === "back") Nav.stack.pop();
  else Nav.stack.push(name);

  appEl.appendChild(next);
  Nav.name = name; Nav.el = next;
  if (mounts[name]) mounts[name](next);

  if (!prev || anim === "none" || reduceMotion || !next.animate) { if (prev) prev.remove(); return; }

  Nav.busy = true;
  appEl.classList.add("animating");
  const fwd = anim !== "back";
  next.style.zIndex = fwd ? 2 : 1;
  prev.style.zIndex = fwd ? 1 : 2;
  const opts = { duration: TRANSITION.duration, easing: TRANSITION.easing, fill: "both" };
  const inFrames = fwd
    ? [{ transform: "translateX(100%)" }, { transform: "translateX(0)" }]
    : [{ transform: `translateX(${TRANSITION.behind})` }, { transform: "translateX(0)" }];
  const outFrames = fwd
    ? [{ transform: "translateX(0)" }, { transform: `translateX(${TRANSITION.behind})` }]
    : [{ transform: "translateX(0)" }, { transform: "translateX(100%)" }];
  const a = next.animate(inFrames, opts);
  const b = prev.animate(outFrames, opts);
  Promise.all([a.finished, b.finished]).catch(() => {}).finally(() => {
    prev.remove();
    a.cancel(); b.cancel();
    next.style.zIndex = "";
    appEl.classList.remove("animating");
    Nav.busy = false;
  });
}

const navigate = (name) => show(name, { anim: "forward" });
const goBack = () => { if (Nav.stack.length > 1) show(Nav.stack[Nav.stack.length - 2], { anim: "back" }); };

/* ---------- Logout helper (abhi UI mein nahi; Profile/Settings page mein use hoga) ---------- */
function logout() {
  const auth = getAuth();
  return auth ? auth.signOut() : Promise.resolve();
}

/* ---------- App bootstrap + session ---------- */
function boot() {
  const auth = getAuth();
  if (!auth) { show("welcome", { anim: "none" }); return; }

  show("splash", { anim: "none" });             // session check hone tak black splash (blank/flash nahi)
  let first = true;
  auth.onAuthStateChanged(async (user) => {
    AppState.user = user || null;
    if (first) {                                // app khulte hi: valid session ho to Home (ya username baaki ho to Username Page)
      first = false;
      if (!user) { show("welcome", { anim: "none" }); return; }
      try { await routeAfterAuth(user, "none"); }
      catch (_) { show("welcome", { anim: "none" }); showToast("Internet connection check karein."); }
      return;
    }
    if (!user) {                                // logout ya session khatam
      AppState.profile = {};
      if (["home", "categories", "cart", "profile"].includes(Nav.name)) show("welcome", { anim: "back", reset: true });
    }
  });
}
boot();
</script>
</body>
</html>
